<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイ・リンク集</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #2da44e; /* GitHubライクなグリーン */
            --hover-color: #2c974b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-item {
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-decoration: none;
            color: var(--text-color);
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            border: 2px solid transparent;
            text-align: center;
        }

        .link-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            border-color: var(--accent-color);
            color: var(--hover-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Link Collection</h1>
        <div id="link-container" class="link-list">
            </div>
    </div>

    <script>
        // --- 【ここにJSONデータを入力してください】 ---
        const linkData = [
            { "name": "Google", "url": "https://www.google.com" },
            { "name": "GitHub", "url": "https://github.com" },
            { "name": "X (旧Twitter)", "url": "https://x.com" },
            { "name": "YouTube", "url": "https://www.youtube.com" }
        ];
        // --------------------------------------------

        // JSONデータを元にHTML要素を生成する関数
        function generateLinks(links) {
            const container = document.getElementById('link-container');
            
            links.forEach(link => {
                const a = document.createElement('a');
                a.href = link.url;
                a.textContent = link.name;
                a.className = 'link-item';
                a.target = '_blank'; // 新しいタブで開く
                a.rel = 'noopener noreferrer'; // セキュリティ対策
                
                container.appendChild(a);
            });
        }

        // 実行
        generateLinks(linkData);
    </script>
</body>
</html>
